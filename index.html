<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Frame-Options" content="DENY">
<title>L&#9829;H TOOLKIT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ═══ FULL WHITE THEME ═══ */
* { -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
:root{
  --bg:#ffffff;
  --nm:#ffffff;
  --nl:#ffffff;
  --nd:#e8e8e8;
  --ac:#ff3366;
  --ac2:#ff6b35;
  --gd:#f59e0b;
  --tx:#1a1a2e;
  --tx2:#4a5568;
  --mt:#94a3b8;
  --gr:#10b981;
  --bl:#3b82f6;
  --gw:rgba(255,51,102,0.15);
  --shadow:4px 4px 14px rgba(0,0,0,.08),-4px -4px 14px rgba(255,255,255,.9);
  --shadow-sm:3px 3px 8px rgba(0,0,0,.07),-3px -3px 8px rgba(255,255,255,.9);
  --shadow-in:inset 3px 3px 8px rgba(0,0,0,.07),inset -3px -3px 8px rgba(255,255,255,.9);
}
/* ═══ DARK NEUMORPHISM ═══ */
[data-theme="dark"]{
  --bg:#1e2235;
  --nm:#232840;
  --nl:#2a3050;
  --nd:#141828;
  --tx:#e0e8f0;
  --tx2:#8899bb;
  --mt:#4a5580;
  --gw:rgba(255,51,102,0.35);
  --shadow:8px 8px 20px #141828,-8px -8px 20px #2a3050;
  --shadow-sm:5px 5px 12px #141828,-5px -5px 12px #2a3050;
  --shadow-in:inset 4px 4px 10px #141828,inset -4px -4px 10px #2a3050;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:"Rajdhani",sans-serif;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;}

/* SCREENS */
.scr{display:none;}
.scr.on{display:flex;}
#ls.on{position:fixed;inset:0;z-index:200;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;padding:20px;background:var(--bg);}
#ws.on{position:fixed;inset:0;z-index:500;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);}
#ts.on{flex-direction:column;min-height:100vh;}


/* FALLING FLOWERS */
.flowers{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.flower{position:absolute;top:-60px;font-size:1.8rem;animation:fall linear infinite;opacity:0;}
@keyframes fall{
  0%{transform:translateY(-60px) rotate(0deg);opacity:1;}
  80%{opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}


/* LOGIN CARD */
.lc{position:relative;z-index:10;width:100%;max-width:400px;padding:38px 26px 30px;background:var(--nm);box-shadow:var(--shadow);border-radius:24px;text-align:center;animation:ci .6s ease;}
@keyframes ci{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

/* LOGO */
.lg{width:90px;height:90px;border-radius:22px;object-fit:cover;display:block;margin:0 auto 14px;
  box-shadow:var(--shadow-sm),0 0 20px var(--gw);
  animation:hb 2.8s ease-in-out infinite;}
@keyframes hb{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

.lt{font-family:"Orbitron",sans-serif;font-size:1.4rem;font-weight:800;
  background:linear-gradient(135deg,var(--ac),var(--gd));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:4px;letter-spacing:2px;}
.lsub{color:var(--tx2);font-size:.88rem;margin-bottom:22px;}

/* INPUT */
.iw{position:relative;margin-bottom:14px;}
.iw .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mt);font-size:.88rem;z-index:3;pointer-events:none;}
.ki{width:100%;padding:13px 16px 13px 42px;
  background:var(--nm);box-shadow:var(--shadow-in);
  border:2px solid transparent;border-radius:12px;
  color:var(--tx);font-size:1rem;font-family:"Rajdhani",sans-serif;outline:none;
  position:relative;z-index:2;caret-color:var(--ac);transition:border .2s;}
.ki::placeholder{color:var(--mt);}
.ki:focus{border-color:var(--ac);}
/* Animated border */
.iw::before{content:"";position:absolute;inset:-2px;border-radius:14px;padding:2px;
  background:linear-gradient(90deg,transparent,var(--ac),var(--gd),var(--ac2),transparent);
  background-size:300% 300%;animation:br 6s linear infinite;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:destination-out;mask-composite:exclude;z-index:1;pointer-events:none;}
@keyframes br{0%{background-position:200% center;}100%{background-position:-200% center;}}

/* UNLOCK BTN */
.ubn{width:100%;padding:14px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  border:none;border-radius:12px;color:#fff;
  font-family:"Orbitron",sans-serif;font-size:.8rem;font-weight:700;
  cursor:pointer;letter-spacing:2px;
  box-shadow:var(--shadow-sm),0 4px 20px var(--gw);
  transition:all .2s;}
.ubn:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm),0 6px 24px var(--gw);}
.ubn:active{transform:scale(.97);}
.err{color:var(--ac);font-size:.82rem;margin-top:10px;display:none;padding:8px;border-radius:8px;background:rgba(255,51,102,.08);}
.bla{margin-top:12px;color:var(--tx2);font-size:.83rem;}
.wab{display:flex;align-items:center;justify-content:center;gap:9px;
  margin-top:10px;padding:13px;
  background:linear-gradient(135deg,#25d366,#128c7e);
  border-radius:13px;color:#fff!important;text-decoration:none;
  font-family:"Orbitron",sans-serif;font-size:.78rem;font-weight:700;
  letter-spacing:1px;transition:all .2s;
  box-shadow:var(--shadow-sm);}
.wab:hover{transform:translateY(-2px);}
.wab i{font-size:1.2rem;}

/* WELCOME */
.wi{text-align:center;}
.wico{font-size:4.5rem;animation:pu 1.5s ease-in-out infinite;display:block;margin-bottom:10px;}
@keyframes pu{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
/* WELCOME LOGO */
.w-logo{
  width:100px;height:100px;border-radius:24px;object-fit:cover;
  display:block;margin:0 auto 16px;
  box-shadow:0 0 0 4px rgba(255,51,102,.3),0 0 40px rgba(255,51,102,.4),0 0 80px rgba(255,51,102,.2);
  animation:wlg 1.5s ease-in-out infinite;
}
@keyframes wlg{
  0%,100%{transform:scale(1) rotate(-2deg);box-shadow:0 0 0 4px rgba(255,51,102,.3),0 0 40px rgba(255,51,102,.4);}
  50%{transform:scale(1.08) rotate(2deg);box-shadow:0 0 0 8px rgba(255,51,102,.5),0 0 60px rgba(255,51,102,.6),0 0 100px rgba(255,215,0,.3);}
}
.wtit{font-family:"Orbitron",sans-serif;font-size:1.1rem;font-weight:900;
  background:linear-gradient(135deg,var(--ac),var(--gd),var(--ac2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:10px;letter-spacing:2px;line-height:1.4;}
/* wtit defined above */
.wmsg{color:var(--tx2);font-size:.98rem;}
.wu{color:var(--gd);font-weight:700;}
.wbar{width:190px;height:4px;background:var(--nd);border-radius:2px;margin:18px auto 0;overflow:hidden;}
.wbf{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--gd));border-radius:2px;animation:bf 2s ease-in-out forwards;}
@keyframes bf{to{width:100%;}}

/* TOPBAR */
.tpb{height:62px;background:var(--nm);box-shadow:0 4px 16px var(--nd);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;position:sticky;top:0;z-index:100;flex-shrink:0;transition:background .3s;}
.tbrand{font-family:"Orbitron",sans-serif;font-size:.9rem;font-weight:800;
  display:flex;align-items:center;gap:9px;
  background:linear-gradient(135deg,var(--ac),var(--gd));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tbrl{width:34px;height:34px;border-radius:10px;object-fit:cover;box-shadow:var(--shadow-sm);}
.tbri{display:flex;align-items:center;gap:8px;}
.kbdg{background:rgba(245,158,11,.1);color:var(--gd);border:1px solid rgba(245,158,11,.3);
  padding:4px 10px;border-radius:20px;font-size:.7rem;font-family:"Orbitron",sans-serif;}
.icb{width:38px;height:38px;border:none;border-radius:10px;cursor:pointer;
  background:var(--nm);box-shadow:var(--shadow-sm);
  color:var(--tx2);font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.icb:hover{color:var(--ac);}

/* CONTENT */
.con{flex:1;padding:20px 16px;max-width:1000px;margin:0 auto;width:100%;}
.stit{font-family:"Orbitron",sans-serif;font-size:.78rem;color:var(--tx2);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;}
.stit::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--nd),transparent);}
.stit i{color:var(--ac);}

/* KEY INFO BAR */
.kib{background:var(--nm);box-shadow:var(--shadow-sm);border-radius:14px;
  padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.kii{width:42px;height:42px;border-radius:11px;background:var(--nm);
  box-shadow:var(--shadow-in);
  display:flex;align-items:center;justify-content:center;color:var(--gd);font-size:1.1rem;}
.kik{font-family:"Orbitron",sans-serif;font-size:.76rem;color:var(--gd);}
.kie{font-size:.74rem;color:var(--tx2);margin-top:2px;}
.kie span{color:var(--gr);font-weight:700;}

/* TOOLS GRID */
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
@media(max-width:560px){.tg{grid-template-columns:repeat(2,1fr);}}

/* TOOL CARD */
.tc{background:var(--nm);box-shadow:var(--shadow-sm);
  border-radius:18px;padding:20px 10px;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease;}
.tc:active{transform:scale(.94);box-shadow:var(--shadow-in);}
.tc{
  text-decoration:none;color:var(--tx);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;
  transition:all .25s;animation:ce .3s ease both;
  border-bottom:2px solid rgba(255,51,102,.15);}
.tc:hover{transform:translateY(-5px);
  box-shadow:10px 10px 24px var(--nd),-10px -10px 24px var(--nl),0 0 20px var(--gw);
  border-bottom-color:var(--ac);}
@keyframes ce{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.tiw{width:72px;height:72px;border-radius:18px;background:var(--nm);
  box-shadow:var(--shadow-in);
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--ac);}
.tiw img{width:52px;height:52px;border-radius:14px;object-fit:cover;}
.tnm{font-weight:700;font-size:.92rem;color:var(--tx);}
.tds{font-size:.73rem;color:var(--tx2);line-height:1.3;}
.emp{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--mt);}
.emp i{font-size:2.5rem;margin-bottom:12px;display:block;opacity:.4;}
.ldg{grid-column:1/-1;text-align:center;padding:40px;color:var(--mt);}
.sp{width:36px;height:36px;border-radius:50%;border:3px solid var(--nd);
  border-top-color:var(--ac);animation:spin .8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}

.foot{text-align:center;padding:16px;color:var(--mt);font-size:.75rem;}
.tst{position:fixed;bottom:18px;right:18px;background:var(--nm);box-shadow:var(--shadow-sm);
  color:var(--gr);padding:11px 18px;border-radius:11px;font-size:.85rem;
  transform:translateY(100px);opacity:0;transition:all .4s;z-index:9999;
  border-left:3px solid var(--gr);}
.tst.on{transform:translateY(0);opacity:1;}
.tst.er{color:var(--ac);border-left-color:var(--ac);}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splashScr" style="position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;">
  <div id="splashLogo" style="width:90px;height:90px;border-radius:22px;overflow:hidden;box-shadow:0 0 40px rgba(255,51,102,.5);animation:splashPulse 1.5s ease-in-out infinite;">
    <img id="splashImg" src="" style="width:100%;height:100%;object-fit:cover;">
  </div>
  <div style="font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#ff3366,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">L&#9829;H TOOLKIT</div>
  <div style="display:flex;gap:6px;">
    <div style="width:8px;height:8px;border-radius:50%;background:#ff3366;animation:splashDot 1.2s ease-in-out infinite;"></div>
    <div style="width:8px;height:8px;border-radius:50%;background:#ff6b35;animation:splashDot 1.2s ease-in-out infinite .2s;"></div>
    <div style="width:8px;height:8px;border-radius:50%;background:#ffd700;animation:splashDot 1.2s ease-in-out infinite .4s;"></div>
  </div>
</div>
<style>
@keyframes splashPulse{0%,100%{box-shadow:0 0 30px rgba(255,51,102,.4);}50%{box-shadow:0 0 60px rgba(255,51,102,.8);}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes splashDot{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-8px);opacity:1;}}
</style>

// ═══ FIREBASE DIRECT — No auth needed, instant ═══
var _FB_DB = "https://toolkit-73b2a-default-rtdb.firebaseio.com";

async function _fbGet(path){
  try{
    var r=await fetch(_FB_DB+"/"+path+".json");
    var t=await r.text();
    return(t&&t!=="null")?JSON.parse(t):null;
  }catch(e){return null;}
}

async function _fbSet(path,data){
  try{
    await fetch(_FB_DB+"/"+path+".json",{
      method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)
    });
  }catch(e){}
}

// ── api() shim — maps old Vercel actions to Firebase directly ──
async function api(action,payload){
  try{
    if(action==="verifyKey"){
      var k=(payload.key||"").trim().toUpperCase();
      var now=Date.now();
      // Query Firebase by key value directly — no need to read all keys
      try{
        var url=_FB_DB+"/keys.json?orderBy=%22key%22&equalTo=%22"+encodeURIComponent(k)+"%22";
        var r2=await fetch(url);
        var txt=await r2.text();
        var result=(txt&&txt!=="null")?JSON.parse(txt):null;
        if(!result||!Object.keys(result).length)
          return{ok:false,msg:"Invalid key! Buy from admin."};
        var id=Object.keys(result)[0];
        var kd=result[id];
        if(kd.expiry<now)return{ok:false,msg:"Key expired!"};
        if(kd.deviceId&&kd.deviceId!==(payload.deviceId||""))
          return{ok:false,msg:"Key locked to another device!"};
        if(!kd.deviceId&&payload.deviceId){
          await _fbSet("keys/"+id+"/deviceId",payload.deviceId);
          await _fbSet("keys/"+id+"/used",true);
        }
        return{ok:true,expiry:kd.expiry,keyId:id};
      }catch(e2){
        return{ok:false,msg:"Connection error. Try again."};
      }
    }

    if(action==="getTools"){
      var tools=await _fbGet("tools");
      if(!tools)return{ok:true,tools:[]};
      var arr=[];
      for(var tid in tools){
        var t=tools[tid];
        if(t.active!==false)arr.push(t);
      }
      return{ok:true,tools:arr};
    }

    if(action==="getSettings"){
      var s=await _fbGet("settings");
      return{ok:true,settings:s||{}};
    }

    if(action==="getPhone"){
      var ph=await _fbGet("admin/phone");
      return{ok:true,phone:ph||"923277796795"};
    }

    return{ok:false,msg:"Unknown action"};
  }catch(e){
    return{ok:false,msg:"Connection error"};
  }
}

var curKey=null,curExp=null,curTh="light";

function setTh(th){

  ["thTk"].forEach(function(id){

function showS(id){

function getDevId(){
  var raw=navigator.userAgent+navigator.language+screen.width+screen.height;
  var h=0;for(var i=0;i<raw.length;i++){h=((h<<5)-h)+raw.charCodeAt(i);h|=0;}
  return"d_"+Math.abs(h).toString(36);
}

async function doLogin(){
  var k=document.getElementById("lk").value.trim().toUpperCase();
  var e=document.getElementById("err");
  e.style.display="none";
  if(!k){e.textContent="Please enter your license key!";e.style.display="block";return;}
  e.textContent="Verifying...";e.style.color="var(--bl)";e.style.display="block";
  var res=await api("verifyKey",{key:k,deviceId:getDevId()});
  if(!res.ok){e.textContent=res.msg||"Invalid key!";e.style.color="var(--ac)";e.style.display="block";return;}
  e.style.display="none";
  curKey=k;
  // Ensure expiry is a valid timestamp number
  curExp=res.expiry?parseInt(res.expiry):null;
  if(!curExp||isNaN(curExp)){
    // Fallback: if server didn't return expiry, use 1 day from now
    curExp=Date.now()+86400000;
  }
  localStorage.setItem("lh_k",k);
  localStorage.setItem("lh_e",String(curExp));
  // Start tool prefetch immediately
  _prefetchTools();
  showWelcome();
}

function showWelcome(){
  // Skip welcome screen — go straight to toolkit instantly
  showS("ts");
  loadUI();
}

// Prefetch tools in background — stores in cache so loadTools() shows instantly
var _prefetchPromise=null;
function _prefetchTools(){
  if(!curKey)return;
  _prefetchPromise=api("getTools",{}).then(function(res){
    if(res&&res.ok&&res.tools){
      _toolsCache=res.tools;
      _toolsCacheTime=Date.now();
    }
    _prefetchPromise=null;
  }).catch(function(){_prefetchPromise=null;});
}

async function loadUI(){
  // Sanitize key display — decode if btoa encoded
  var dispKey=curKey||"";
  try{
    var dec=atob(dispKey);
    if(dec&&dec.match(/^[A-Z0-9\-]+$/))dispKey=dec;
  }catch(e2){}
  curKey=dispKey; // make sure curKey is clean
  document.getElementById("kSh").textContent=dispKey;
  // Show masked key e.g. LH-X***-***X
  var masked=dispKey.length>6?dispKey.substring(0,4)+"****"+dispKey.slice(-4):dispKey;
  document.getElementById("wU").textContent=masked;
  if(curExp&&!isNaN(curExp)&&curExp>Date.now()){
    // Estimate key created time from days stored
    if(!_keyCreatedTime) _keyCreatedTime=curExp-(30*86400000); // fallback 30d
    updateKeyBar();
    startCountdown();
  } else if(curExp&&curExp<=Date.now()){
    document.getElementById("kEx").textContent="EXPIRED";
    document.getElementById("kbdg").innerHTML="<i class='fas fa-clock'></i> EXP";if(document.getElementById("kbdg2"))document.getElementById("kbdg2").innerHTML="<i class='fas fa-clock'></i> EXP";
  }
  // Load tools immediately
  loadTools();
  // Settings background
  _fbGet("settings").then(function(s){
    if(!s)return;
    if(s.theme)setTh(s.theme);
    if(s.toolkit){
      if(s.toolkit.name){document.getElementById("wT")&&(document.getElementById("wT").textContent=s.toolkit.name);document.getElementById("tpN")&&(document.getElementById("tpN").textContent=s.toolkit.name);}
      if(s.toolkit.welcome)document.getElementById("wM")&&(document.getElementById("wM").textContent=s.toolkit.welcome);
      if(s.toolkit.logoUrl){document.getElementById("tpL")&&(document.getElementById("tpL").src=s.toolkit.logoUrl);document.getElementById("mLg")&&(document.getElementById("mLg").src=s.toolkit.logoUrl);}
    }
    if(s.announcement)showAnn(s.announcement);
  });
}

function _renderTools(tools){
  var g=document.getElementById("tG");
  g.innerHTML="";
  var cnt=document.getElementById("toolCount");
  if(cnt)cnt.textContent=tools&&tools.length?(tools.length+" Tools"):"";
  if(!tools||!tools.length){
    g.innerHTML="<div class='emp' style='grid-column:1/-1;text-align:center;padding:40px 20px'><div style='font-size:3rem;margin-bottom:12px'>🔧</div><p style='color:var(--mt);font-size:.88rem'>No tools yet<br>Check back soon!</p></div>";
    return;
  }
  tools.forEach(function(t,i){
    var ic=t.iconUrl
      ?"<img src='"+t.iconUrl+"' alt='' style='width:52px;height:52px;border-radius:14px;object-fit:cover'>"
      :(t.iconBase64?"<img src='"+t.iconBase64+"' alt=''>"
      :"<i class='"+(t.iconClass||"fas fa-star")+"' style='color:var(--ac)'></i>");
    var c=document.createElement("a");
    c.className="tc";
    c.href=t.link||"#";
    c.target="_blank";
    c.rel="noopener noreferrer";
    c.style.animationDelay=(i*.04)+"s";
    c.innerHTML="<div class='tiw'>"+ic+"</div>"
      +"<div class='tnm'>"+t.name+"</div>"
      +(t.desc?"<div class='tds'>"+t.desc+"</div>":"");
    g.appendChild(c);
  });
}

var _toolsCache=null;
var _toolsCacheTime=0;
var _CACHE_TTL=5*60*1000; // 5 minutes cache

async function loadTools(){
  var g=document.getElementById("tG");
  var now=Date.now();

  // Cache valid — instant show
  if(_toolsCache&&(now-_toolsCacheTime)<_CACHE_TTL){
    _renderTools(_toolsCache);
    return;
  }

  // Show skeleton
  g.innerHTML="";
  for(var s=0;s<6;s++){
    var sk=document.createElement("div");
    sk.className="tc";
    sk.style.cssText="background:var(--nm);box-shadow:var(--shadow-sm);border-radius:18px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:default;";
    sk.innerHTML="<div style='width:72px;height:72px;border-radius:18px;background:linear-gradient(90deg,var(--nd) 25%,var(--nl) 50%,var(--nd) 75%);background-size:200% 100%;animation:skA 1.2s ease-in-out infinite'></div><div style='height:13px;width:70%;border-radius:6px;background:linear-gradient(90deg,var(--nd) 25%,var(--nl) 50%,var(--nd) 75%);background-size:200% 100%;animation:skA 1.2s ease-in-out infinite'></div><div style='height:11px;width:50%;border-radius:6px;background:linear-gradient(90deg,var(--nd) 25%,var(--nl) 50%,var(--nd) 75%);background-size:200% 100%;animation:skA 1.2s ease-in-out infinite'></div>";
    g.appendChild(sk);
  }
  if(!document.getElementById("_skCSS")){
    var st=document.createElement("style");
    st.id="_skCSS";
    st.textContent="@keyframes skA{0%{background-position:200% 0}100%{background-position:-200% 0}}";
    document.head.appendChild(st);
  }

  // Direct Firebase fetch — fast
  var tools=await _fbGet("tools");
  if(tools){
    var arr=[];
    for(var id in tools){
      if(tools[id].active!==false)arr.push(tools[id]);
    }
    _toolsCache=arr;
    _toolsCacheTime=Date.now();
    _allTools=arr;
    buildCategories(arr);
    _renderTools(arr);
  } else {
    g.innerHTML="<div class='emp' style='grid-column:1/-1'><i class='fas fa-wifi' style='color:var(--ac)'></i><p style='margin:8px 0'>Could not load tools</p><button onclick='_toolsCache=null;loadTools();' style='margin-top:10px;padding:10px 22px;background:var(--ac);color:#fff;border:none;border-radius:10px;font-size:.88rem;cursor:pointer;font-weight:700'>↺ Retry</button></div>";
  }
}

// ═══ LIVE COUNTDOWN TIMER ═══
var _cdTimer=null;
function startCountdown(){
  clearInterval(_cdTimer);
  function tick(){
    var rem=curExp-Date.now();
    updateKeyBar();
    if(rem<=0){
      document.getElementById("kEx").textContent="EXPIRED";
      document.getElementById("kbdg").innerHTML="<i class='fas fa-clock'></i> EXP";if(document.getElementById("kbdg2"))document.getElementById("kbdg2").innerHTML="<i class='fas fa-clock'></i> EXP";
      clearInterval(_cdTimer);
      setTimeout(function(){doLogout();tst("Key expired!",false);},1500);
      return;
    }
    var h=Math.floor(rem/3600000);
    var m=Math.floor((rem%3600000)/60000);
    var s=Math.floor((rem%60000)/1000);
    var hh=h>0?(h+"h "):"";
    var mm=(m<10?"0"+m:m)+"m ";
    var ss=(s<10?"0"+s:s)+"s";
    var fullTxt=hh+mm+ss;
    // Short badge
    var badgeTxt=h>0?(h+"h"):((m<10?"0"+m:m)+"m");
    document.getElementById("kEx").textContent=fullTxt;
    var bdgHTML="<i class='fas fa-clock'></i> "+badgeTxt;
    document.getElementById("kbdg").innerHTML=bdgHTML;
    if(document.getElementById("kbdg2"))document.getElementById("kbdg2").innerHTML=bdgHTML;
    // Warn red when < 1 hour
    if(rem<3600000){
      ["kbdg","kbdg2"].forEach(function(id){
        var el=document.getElementById(id);
        if(el){el.style.background="rgba(239,68,68,.15)";el.style.color="var(--ac)";el.style.borderColor="rgba(239,68,68,.3)";}
      });
    }
  }
  tick();
  _cdTimer=setInterval(tick,1000);
}

function doLogout(){
  clearInterval(_cdTimer);
  _toolsCache=null;_toolsCacheTime=0;_prefetchPromise=null;
  curKey=null;curExp=null;
  localStorage.removeItem("lh_k");
  localStorage.removeItem("lh_e");
  document.getElementById("lk").value="";
  document.getElementById("err").style.display="none";
  showS("ls");tst("Logged out!");
}

async function autoLogin(){
  var k=localStorage.getItem("lh_k");
  var expRaw=localStorage.getItem("lh_e");
  if(!k||!expRaw){return;}
  // Handle both plain and btoa-encoded values safely
  var exp;
  try{
    // Try plain number first
    exp=parseInt(expRaw);
    if(isNaN(exp)){
      // Try btoa decode
      exp=parseInt(atob(expRaw));
    }
  }catch(e2){exp=0;}
  if(!exp||isNaN(exp)||exp<Date.now()){
    localStorage.removeItem("lh_k");
    localStorage.removeItem("lh_e");
    return;
  }
  // Also handle btoa-encoded key
  var key=k;
  try{
    var decoded=atob(k);
    // btoa decoded strings look like keys (LH-XXXX format)
    if(decoded.match(/^[A-Z0-9\-]+$/))key=decoded;
  }catch(e2){}
  curKey=key;curExp=exp;
  // Start tool prefetch immediately — don't wait for animation
  _prefetchTools();
  showWelcome();
}

// ── OFFLINE DETECTION ──
window.addEventListener('online',  function(){ document.getElementById('offlineBar').style.display='none'; });
window.addEventListener('offline', function(){ document.getElementById('offlineBar').style.display='block'; });
if(!navigator.onLine){ document.getElementById('offlineBar').style.display='block'; }

// ── TOOL CATEGORIES ──
var _allTools = [];
var _activeCat = 'All';

function buildCategories(tools){
  var cats = ['All'];
  tools.forEach(function(t){
    if(t.category && cats.indexOf(t.category)===-1) cats.push(t.category);
  });
  var cf = document.getElementById('catFilter');
  cf.innerHTML = '';
  cats.forEach(function(c){
    var btn = document.createElement('button');
    btn.textContent = c;
    btn.onclick = function(){ _activeCat=c; filterTools(); };
    btn.style.cssText = 'border:none;border-radius:20px;padding:5px 14px;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .2s;background:var(--nm);box-shadow:var(--shadow-sm);color:var(--tx2);font-family:inherit;';
    if(c===_activeCat){ btn.style.background='var(--ac)'; btn.style.color='#fff'; btn.style.boxShadow='none'; }
    btn.id = 'cat_'+c;
    cf.appendChild(btn);
  });
}

function filterTools(){
  var q = (document.getElementById('toolSearch').value||'').toLowerCase();
  var filtered = _allTools.filter(function(t){
    var matchCat = _activeCat==='All' || t.category===_activeCat;
    var matchQ = !q || t.name.toLowerCase().indexOf(q)>-1 || (t.desc&&t.desc.toLowerCase().indexOf(q)>-1);
    return matchCat && matchQ;
  });
  _renderTools(filtered);
  // Update active cat button style
  document.querySelectorAll('#catFilter button').forEach(function(btn){
    var isActive = btn.textContent===_activeCat;
    btn.style.background = isActive?'var(--ac)':'var(--nm)';
    btn.style.color = isActive?'#fff':'var(--tx2)';
    btn.style.boxShadow = isActive?'none':'var(--shadow-sm)';
  });
}

// ── PULL TO REFRESH ──
var _ptrStartY=0,_ptrPulling=false;
document.addEventListener("touchstart",function(e){
  if(window.scrollY===0)_ptrStartY=e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend",function(e){
  if(_ptrPulling){
    _ptrPulling=false;
    var ind=document.getElementById("ptrIndicator");
    if(ind)ind.style.display="block";
    _toolsCache=null;
    loadTools().then(function(){
      setTimeout(function(){if(ind)ind.style.display="none";},800);
    });
  }
},{passive:true});
document.addEventListener("touchmove",function(e){
  if(_ptrStartY>0&&e.touches[0].clientY-_ptrStartY>70&&window.scrollY===0){
    _ptrPulling=true;
  }
},{passive:true});

function copyKey(){
  if(!curKey)return;
  navigator.clipboard.writeText(curKey).then(function(){
    var btn=document.getElementById("copyKeyBtn");
    btn.innerHTML='<i class="fas fa-check" style="color:var(--gr)"></i>';
    setTimeout(function(){btn.innerHTML='<i class="fas fa-copy"></i>';},1500);

  });

// ── KEY PROGRESS BAR ──
function updateKeyBar(){
  if(!curExp||!_keyCreatedTime)return;
  var total=curExp-_keyCreatedTime;
  var rem=curExp-Date.now();
  var pct=Math.max(0,Math.min(100,(rem/total)*100));
  var bar=document.getElementById("keyBar");
  if(bar){
    bar.style.width=pct+"%";
    if(pct<20)bar.style.background="linear-gradient(90deg,#ef4444,#ff6b35)";
    else if(pct<50)bar.style.background="linear-gradient(90deg,#f59e0b,#ffd700)";
    else bar.style.background="linear-gradient(90deg,var(--ac),var(--gd))";
  }
}
var _keyCreatedTime=null;

// INIT
setTh(localStorage.getItem("lh_th")||"light");
autoLogin();
