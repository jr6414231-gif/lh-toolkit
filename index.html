<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>L&#9829;H TOOLKIT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
input{-webkit-user-select:text;user-select:text;}
body{background:#f0f2f5;font-family:Inter,sans-serif;min-height:100vh;}

/* SPLASH */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s;}
.sp-logo{width:88px;height:88px;border-radius:22px;object-fit:cover;box-shadow:0 0 40px rgba(255,51,102,.5);animation:splashPulse 2s ease-in-out infinite;}
.sp-title{font-size:1.5rem;font-weight:800;letter-spacing:2px;}
.sp-title span:first-child{color:#ff3366;}.sp-title span:last-child{color:#ffd700;}
.sp-dots{display:flex;gap:8px;}
.sp-dot{width:8px;height:8px;border-radius:50%;animation:dotBounce 1.2s ease-in-out infinite;}
.sp-dot:nth-child(1){background:#ff3366;animation-delay:0s;}
.sp-dot:nth-child(2){background:#ff6b35;animation-delay:.2s;}
.sp-dot:nth-child(3){background:#ffd700;animation-delay:.4s;}
@keyframes splashPulse{0%,100%{box-shadow:0 0 30px rgba(255,51,102,.4);}50%{box-shadow:0 0 60px rgba(255,51,102,.8);}}
@keyframes dotBounce{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-8px);opacity:1;}}

/* SCREENS */
.scr{display:none;}
.scr.on{display:block;}
#ls.on{display:flex!important;}
#ls.on{background:#fff;min-height:100vh;align-items:center;justify-content:center;padding:20px;}

/* LOGIN */
.lw{width:100%;max-width:360px;text-align:center;}
.lcard{background:#f5f5f5;border-radius:36px;padding:38px 28px 32px;box-shadow:20px 20px 50px #d9d9d9,-20px -20px 50px #fff;}
.ll-wrap{width:110px;height:110px;border-radius:50%;margin:0 auto 22px;background:#f5f5f5;box-shadow:8px 8px 20px #d0d0d0,-8px -8px 20px #fff;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:floatLogo 3s ease-in-out infinite,pulsGlow 2.5s ease-in-out infinite;position:relative;}
.ll-wrap::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,rgba(255,51,102,.8) 20%,transparent 40%,rgba(255,180,50,.6) 60%,transparent 80%,rgba(255,51,102,.8) 100%);animation:rotatRing 2s linear infinite;z-index:0;}
.ll-wrap::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:#f5f5f5;z-index:1;}
.ll{width:100%;height:100%;border-radius:50%;object-fit:cover;position:relative;z-index:2;}
.ll-shine{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;overflow:hidden;z-index:3;pointer-events:none;}
.ll-shine::after{content:"";position:absolute;top:-50%;left:-100%;width:60%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shimmer 3s ease-in-out infinite;}
.logo-orbit{position:absolute;width:100%;height:100%;top:0;left:0;z-index:0;pointer-events:none;}
.orbit-dot{position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;margin:-4px;}
.orbit-dot:nth-child(1){background:radial-gradient(circle,#ff3366,#ff6b35);box-shadow:0 0 8px rgba(255,51,102,.8);animation:orbitDot 3s linear infinite;}
.orbit-dot:nth-child(2){background:radial-gradient(circle,#ffd700,#ffaa00);box-shadow:0 0 8px rgba(255,215,0,.8);animation:orbitDot2 3s linear infinite;}
.orbit-dot:nth-child(3){background:radial-gradient(circle,#00e5ff,#09c);box-shadow:0 0 8px rgba(0,229,255,.7);animation:orbitDot3 4.5s linear infinite;width:6px;height:6px;margin:-3px;}
.sparkle{position:absolute;width:6px;height:6px;z-index:5;pointer-events:none;}
.sparkle::before{content:"✦";font-size:10px;color:#ffd700;}
.sparkle:nth-child(1){top:-5px;right:10px;animation:sparkle 2s ease-in-out infinite;}
.sparkle:nth-child(2){top:10px;right:-8px;animation:sparkle 2s ease-in-out infinite .7s;}
.sparkle:nth-child(3){bottom:5px;right:-5px;animation:sparkle 2s ease-in-out infinite 1.4s;}
.sparkle:nth-child(4){bottom:-5px;left:15px;animation:sparkle 2s ease-in-out infinite .3s;}
@keyframes rotatRing{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulsGlow{0%,100%{box-shadow:8px 8px 20px #d0d0d0,-8px -8px 20px #fff,0 0 20px rgba(255,51,102,.2)}50%{box-shadow:8px 8px 20px #d0d0d0,-8px -8px 20px #fff,0 0 40px rgba(255,51,102,.4)}}
@keyframes shimmer{0%{left:-100%;opacity:0}30%{opacity:1}100%{left:150%;opacity:0}}
@keyframes orbitDot{0%{transform:rotate(0) translateX(62px) rotate(0)}100%{transform:rotate(360deg) translateX(62px) rotate(-360deg)}}
@keyframes orbitDot2{0%{transform:rotate(180deg) translateX(62px) rotate(-180deg)}100%{transform:rotate(540deg) translateX(62px) rotate(-540deg)}}
@keyframes orbitDot3{0%{transform:rotate(90deg) translateX(62px) rotate(-90deg)}100%{transform:rotate(450deg) translateX(62px) rotate(-450deg)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes titleGlow{0%,100%{text-shadow:0 0 10px rgba(255,51,102,.3)}50%{text-shadow:0 0 20px rgba(255,51,102,.6),0 0 40px rgba(255,51,102,.2)}}

.lt{font-size:1.5rem;font-weight:900;letter-spacing:3px;margin-bottom:4px;color:#ff3366;text-transform:uppercase;animation:titleGlow 2.5s ease-in-out infinite;}
.ls2{color:#9aa0a8;font-size:.7rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:6px;}
.ls2 span{color:#f59e0b;}
.lerr{color:#ff3366;font-size:.8rem;background:#fff0f3;padding:9px 14px;border-radius:12px;margin-bottom:10px;display:none;border:1px solid rgba(255,51,102,.15);}
.li{width:100%;background:#f0f0f0;border:none;border-radius:50px;padding:16px 22px;color:#555;font-size:.88rem;font-weight:600;outline:none;margin-bottom:16px;font-family:inherit;text-align:center;letter-spacing:1px;box-shadow:inset 6px 6px 14px #d0d0d0,inset -6px -6px 14px #fff;}
.li::placeholder{color:#aab0b8;font-weight:600;letter-spacing:2px;text-transform:uppercase;font-size:.75rem;}
.li:focus{box-shadow:inset 6px 6px 14px #c0c5cc,inset -6px -6px 14px #fff,0 0 0 2px rgba(255,51,102,.25);}
.lbtn{width:100%;background:linear-gradient(180deg,#ff6688 0%,#ff3366 40%,#e8003a 100%);border:none;border-radius:50px;padding:17px;color:#fff;font-size:.88rem;font-weight:800;cursor:pointer;letter-spacing:2px;margin-bottom:14px;text-transform:uppercase;position:relative;box-shadow:0 8px 25px rgba(255,51,102,.5),inset 0 1px 0 rgba(255,255,255,.35);border-top:1px solid rgba(255,160,160,.4);}
.lbtn:active{box-shadow:0 3px 10px rgba(255,51,102,.4),inset 0 2px 6px rgba(0,0,0,.2);transform:translateY(2px);}
.lbuy{width:100%;background:linear-gradient(180deg,#34d399 0%,#10b981 40%,#059669 100%);border:none;border-radius:50px;padding:16px;color:#fff;font-size:.82rem;font-weight:800;cursor:pointer;letter-spacing:2px;text-transform:uppercase;box-shadow:0 8px 25px rgba(16,185,129,.4),inset 0 1px 0 rgba(255,255,255,.35);}
.lbuy:active{box-shadow:0 3px 10px rgba(16,185,129,.35),inset 0 2px 6px rgba(0,0,0,.15);transform:translateY(2px);}
.l-new{color:#aab0b8;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin:10px 0;font-weight:700;}
.l-footer{margin-top:22px;font-size:.65rem;color:#9aa0a8;letter-spacing:2px;font-weight:700;text-transform:uppercase;line-height:1.7;}
.l-footer b{color:#ff3366;}

/* TOPBAR */
.tb{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:0 12px;height:60px;display:flex;align-items:center;gap:7px;position:sticky;top:0;z-index:100;}
.tb-logo{width:36px;height:36px;border-radius:10px;object-fit:cover;}
.tb-name{font-size:.82rem;font-weight:800;flex:1;}
.tb-name span:first-child{color:#ff3366;}.tb-name span:last-child{color:#ff6b35;}
.tb-timer{background:rgba(255,51,102,.08);border:1px solid rgba(255,51,102,.2);border-radius:20px;padding:4px 9px;font-size:.7rem;font-weight:700;color:#ff3366;cursor:pointer;white-space:nowrap;}
.tb-btn{width:36px;height:36px;border:none;background:#f0f2f5;border-radius:10px;cursor:pointer;font-size:.9rem;color:#64748b;display:flex;align-items:center;justify-content:center;}

/* CONTENT */
.con{padding:14px;}
.hero{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff3366,#ffd700,#ff3366);background-size:200%;animation:heroLine 3s linear infinite;}
@keyframes heroLine{0%{background-position:0%}100%{background-position:200%;}}
.hero-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,51,102,.08);border:1px solid rgba(255,51,102,.2);border-radius:20px;padding:3px 10px;font-size:.65rem;font-weight:700;color:#ff3366;margin-bottom:10px;}
.hero-title{font-size:1.5rem;font-weight:800;margin-bottom:6px;}
.hero-title span:first-child{color:#ff3366;}.hero-title span:last-child{color:#ff6b35;}
.hero-welcome{font-size:.8rem;color:#64748b;margin-bottom:14px;display:none;}
.hero-welcome b{color:#ff3366;}
.hero-stats{display:flex;gap:8px;margin-bottom:14px;}
.hs{flex:1;background:#f8fafc;border-radius:12px;padding:10px 4px;text-align:center;}
.hs-val{font-size:.95rem;font-weight:800;line-height:1;}
.hs-lbl{font-size:.6rem;color:#94a3b8;margin-top:3px;}
.hero-search{position:relative;}
.hero-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.82rem;}
.hero-search input{width:100%;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:11px 14px 11px 36px;font-size:.88rem;outline:none;font-family:inherit;color:#1e293b;}
.hero-search input:focus{border-color:#ff3366;}
.tabs{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{border:none;border-radius:20px;padding:7px 16px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;background:#fff;color:#64748b;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.tab.on{background:#ff3366;color:#fff;box-shadow:0 4px 12px rgba(255,51,102,.3);}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.cat{border:none;border-radius:20px;padding:5px 14px;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;background:#fff;color:#64748b;box-shadow:0 2px 6px rgba(0,0,0,.07);}
.cat.on{background:#ff3366;color:#fff;}
.tools-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.tools-hd-t{font-size:.8rem;font-weight:800;color:#1e293b;display:flex;align-items:center;gap:6px;}
.tools-hd-t i{color:#ff3366;}
.tools-badge{background:rgba(255,51,102,.1);color:#ff3366;border:1px solid rgba(255,51,102,.2);border-radius:20px;padding:3px 12px;font-size:.72rem;font-weight:700;}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tc{background:#fff;border-radius:14px;padding:14px 8px;cursor:pointer;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(0,0,0,.07);transition:transform .15s,box-shadow .15s;position:relative;}
.tc:active{transform:scale(.94);}
.tiw{width:54px;height:54px;border-radius:14px;background:#f8fafc;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#ff3366;overflow:hidden;}
.tiw img{width:100%;height:100%;object-fit:cover;}
.tnm{font-size:.75rem;font-weight:700;color:#1e293b;line-height:1.2;}
.tds{font-size:.65rem;color:#94a3b8;}
.fv{position:absolute;top:4px;right:4px;font-size:.8rem;cursor:pointer;background:none;border:none;line-height:1;padding:2px;}
@keyframes toolIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
#annBar{display:none;background:rgba(255,51,102,.05);border:1px solid rgba(255,51,102,.2);border-radius:12px;padding:11px 14px;margin-bottom:14px;align-items:center;gap:10px;}
.emp{grid-column:1/-1;text-align:center;padding:40px 20px;color:#94a3b8;font-size:.88rem;}
#offlineBar{display:none;position:fixed;bottom:0;left:0;right:0;background:#ef4444;color:#fff;text-align:center;padding:10px;font-size:.82rem;font-weight:700;z-index:500;}
.foot{text-align:center;padding:20px;color:#94a3b8;font-size:.72rem;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:.84rem;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
[data-theme="dark"] body{background:#0f172a;}
[data-theme="dark"] .tb,[data-theme="dark"] .hero,[data-theme="dark"] .hs{background:#1e293b!important;color:#f1f5f9;}
[data-theme="dark"] .tnm{color:#f1f5f9;}
[data-theme="dark"] .hero-search input{background:#0f172a;border-color:#334155;color:#f1f5f9;}
[data-theme="dark"] .tab:not(.on),[data-theme="dark"] .cat:not(.on){background:#1e293b;color:#94a3b8;}
[data-theme="dark"] .tg .tc{background:#1e293b;}
[data-theme="dark"] .tiw{background:#0f172a;}
</style>
</head>

<script>
// ═══════════════════════════════════════════
//  API — Firebase hidden server side
//  No Firebase URL in client code
// ═══════════════════════════════════════════
var _API = "/api/data";

async function apiCall(action, method, body) {
  try {
    var opts = { method: method || "GET", headers: { "Content-Type": "application/json" } };
    if (body) opts.body = JSON.stringify(body);
    var r = await fetch(_API + "?action=" + action, opts);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

// ═══ STATE ═══
var curKey = null, curExp = null, _cdTimer = null, _theme = "light";
var _allTools = [], _favs = JSON.parse(localStorage.getItem("lh_favs") || "[]");
var _activeTab = "all", _activeCat = "All";
var _toolsCache = null, _toolsCacheTime = 0;
var _sessionId = Math.random().toString(36).slice(2);
var _keyCreatedTime = null;
var _attempts = 0, _lockUntil = 0;

// ═══ TOAST ═══
function tst(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  setTimeout(function(){ t.classList.remove("on"); }, 2500);
}

// ═══ SCREENS ═══
function showS(id) {
  document.querySelectorAll(".scr").forEach(function(s){ s.classList.remove("on"); });
  var el = document.getElementById(id);
  if (el) el.classList.add("on");
  var sp = document.getElementById("splash");
  if (sp && sp.style.display !== "none") {
    sp.style.opacity = "0";
    setTimeout(function(){ sp.style.display = "none"; }, 400);
  }
}

// ═══ DEVICE ID ═══
function getDevId() {
  var s = localStorage.getItem("lh_did"); if (s) return s;
  var raw = [navigator.userAgent, screen.width, screen.height, navigator.language].join("|");
  var h = 0;
  for (var i = 0; i < raw.length; i++) { h = ((h << 5) - h) + raw.charCodeAt(i); h |= 0; }
  var d = "d_" + Math.abs(h).toString(36);
  localStorage.setItem("lh_did", d); return d;
}

// ═══ LOGIN ═══
async function doLogin() {
  var now = Date.now();
  if (_lockUntil > now) {
    var s = Math.ceil((_lockUntil - now) / 1000);
    showErr("Too many attempts! Wait " + s + "s"); return;
  }
  var k = (document.getElementById("lk").value || "").trim().toUpperCase();
  if (!k) { showErr("Please enter your license key!"); return; }

  showErr("Verifying...", "#60a5fa");

  var did = getDevId();
  var result = await apiCall("verify-key", "POST", { key: k, deviceId: did });

  if (!result) {
    _attempts++;
    if (_attempts >= 5) { _lockUntil = Date.now() + 60000; _attempts = 0; }
    showErr("Connection error! Please try again."); return;
  }

  if (!result.ok) {
    _attempts++;
    if (_attempts >= 5) { _lockUntil = Date.now() + 60000; _attempts = 0; }
    showErr(result.msg || "Invalid key!"); return;
  }

  // SUCCESS
  _attempts = 0;
  hideErr();
  curKey = k;

  // Expiry always in ms from API
  curExp = parseInt(result.expiry) || 0;
  if (curExp > 0 && curExp < 9999999999) curExp = curExp * 1000; // seconds to ms

  _keyCreatedTime = parseInt(result.created) || (Date.now() - (result.days || 30) * 86400000);

  // Save session
  localStorage.setItem("lh_k", k);
  localStorage.setItem("lh_e", String(curExp));
  localStorage.setItem("lh_ct", String(_keyCreatedTime));

  onLogin();
}

function showErr(msg, color) {
  var e = document.getElementById("err");
  e.textContent = msg;
  e.style.color = color || "#ff3366";
  e.style.display = "block";
}
function hideErr() {
  var e = document.getElementById("err");
  e.style.display = "none";
}

// ═══ AUTO LOGIN ═══
// IMPORTANT: Always verify with server — no localStorage bypass
async function autoLogin() {
  var k = localStorage.getItem("lh_k");
  if (!k) { showS("ls"); return; }

  showErr("Checking session...", "#60a5fa");

  var did = getDevId();
  var result = await apiCall("verify-key", "POST", { key: k, deviceId: did });

  if (!result || !result.ok) {
    // Clear invalid session
    localStorage.removeItem("lh_k");
    localStorage.removeItem("lh_e");
    localStorage.removeItem("lh_ct");
    hideErr();
    if (result && result.msg) showErr(result.msg);
    showS("ls"); return;
  }

  // Valid session
  curKey = k;
  curExp = parseInt(result.expiry) || 0;
  if (curExp > 0 && curExp < 9999999999) curExp = curExp * 1000;
  _keyCreatedTime = parseInt(result.created) || (Date.now() - (result.days || 30) * 86400000);
  localStorage.setItem("lh_e", String(curExp));
  localStorage.setItem("lh_ct", String(_keyCreatedTime));
  hideErr();
  onLogin();
}

// ═══ COUNTDOWN TIMER ═══
function startCountdown() {
  clearInterval(_cdTimer);
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function tick() {
    if (!curExp) { 
      var tt = document.getElementById("tbTimer");
      if (tt) tt.textContent = "&#8987; --";
      return; 
    }
    var rem = curExp - Date.now();
    if (rem <= 0) {
      var tt2 = document.getElementById("tbTimer");
      if (tt2) tt2.textContent = "EXPIRED";
      clearInterval(_cdTimer);
      setTimeout(function(){ doLogout(); tst("Key expired!"); }, 1500);
      return;
    }
    var days = Math.floor(rem / 86400000);
    var hrs  = Math.floor((rem % 86400000) / 3600000);
    var mins = Math.floor((rem % 3600000) / 60000);
    var secs = Math.floor((rem % 60000) / 1000);
    var badge = pad(days) + ":" + pad(hrs) + ":" + pad(mins) + ":" + pad(secs);
    var tt3 = document.getElementById("tbTimer");
    if (tt3) tt3.textContent = "&#8987; " + badge;
    var kex = document.getElementById("kEx");
    if (kex) kex.textContent = days + "d " + hrs + "h " + mins + "m " + secs + "s remaining";
    if (_keyCreatedTime && _keyCreatedTime > 0) {
      var total = curExp - _keyCreatedTime;
      var pct = total > 0 ? Math.max(0, Math.min(100, (rem / total) * 100)) : 100;
      var bar = document.getElementById("keyBar");
      if (bar) bar.style.width = pct + "%";
    }
  }
  tick();
  _cdTimer = setInterval(tick, 1000);
}

// ═══ LOAD TOOLS ═══
async function loadTools() {
  var g = document.getElementById("tG");
  if (_toolsCache && Date.now() - _toolsCacheTime < 300000) { filterTools(); return; }
  // Skeleton
  g.innerHTML = "";
  for (var i = 0; i < 6; i++) {
    var sk = document.createElement("div");
    sk.style.cssText = "background:#f8fafc;border-radius:14px;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;";
    sk.innerHTML = "<div style='width:52px;height:52px;border-radius:14px;background:linear-gradient(90deg,#e2e8f0 25%,#f8fafc 50%,#e2e8f0 75%);background-size:200%;animation:sk 1.2s infinite'></div><div style='height:11px;width:70%;border-radius:5px;background:linear-gradient(90deg,#e2e8f0 25%,#f8fafc 50%,#e2e8f0 75%);background-size:200%;animation:sk 1.2s infinite'></div>";
    g.appendChild(sk);
  }
  if (!document.getElementById("_skCSS")) {
    var st = document.createElement("style"); st.id = "_skCSS";
    st.textContent = "@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}";
    document.head.appendChild(st);
  }
  var result = await apiCall("tools", "GET");
  if (result && result.tools) {
    _toolsCache = result.tools;
    _toolsCacheTime = Date.now();
    _allTools = result.tools;
  }
  buildCats(); filterTools();
}

function buildCats() {
  var cats = [], cf = document.getElementById("catFilter");
  _allTools.forEach(function(t){ if (t.category && cats.indexOf(t.category) === -1) cats.push(t.category); });
  cf.innerHTML = "";
  if (!cats.length) { cf.style.display = "none"; return; }
  cf.style.display = "flex";
  cats.forEach(function(c) {
    var b = document.createElement("button");
    b.className = "cat" + (c === _activeCat ? " on" : "");
    b.textContent = c;
    b.onclick = function(){ _activeCat = c; filterTools(); };
    cf.appendChild(b);
  });
}

function filterTools() {
  var q = (document.getElementById("toolSearch").value || "").toLowerCase();
  var now = Date.now();
  var filtered = _allTools.filter(function(t) {
    var mQ = !q || t.name.toLowerCase().indexOf(q) > -1 || (t.desc && t.desc.toLowerCase().indexOf(q) > -1);
    var mC = _activeCat === "All" || t.category === _activeCat;
    var mT = true;
    if (_activeTab === "trending") mT = (t.trending === true);
    else if (_activeTab === "latest") mT = (!t.created || (now - t.created) < 30 * 86400000);
    else if (_activeTab === "fav") mT = _favs.indexOf(t.name) > -1;
    return mQ && mC && mT;
  });
  renderTools(filtered);
}

function setTab(t) {
  _activeTab = t;
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.remove("on"); });
  var el = document.getElementById("tab_" + t); if (el) el.classList.add("on");
  filterTools();
}

function renderTools(tools) {
  var g = document.getElementById("tG"); g.innerHTML = "";
  var cnt = document.getElementById("toolCount");
  if (cnt) cnt.textContent = (tools ? tools.length : 0) + " Tools";
  var stat = document.getElementById("toolsCountStat");
  if (stat) stat.textContent = _allTools.length;
  if (!tools || !tools.length) {
    g.innerHTML = "<div class='emp'><div style='font-size:2.5rem;margin-bottom:8px'>&#128295;</div><p>No tools found</p></div>";
    return;
  }
  tools.forEach(function(t, i) {
    var ic = t.iconUrl
      ? "<img src='" + t.iconUrl + "' style='width:100%;height:100%;object-fit:cover;border-radius:14px'>"
      : "<i class='" + (t.iconClass || "fas fa-star") + "'></i>";
    var isFav = _favs.indexOf(t.name) > -1;
    var c = document.createElement("a");
    c.className = "tc"; c.href = t.link || "#"; c.target = "_blank"; c.rel = "noopener noreferrer";
    c.style.animation = "toolIn .35s ease " + (i * .05) + "s both";
    c.innerHTML = "<div class='tiw'>" + ic + "</div>"
      + "<div class='tnm'>" + t.name + "</div>"
      + (t.desc ? "<div class='tds'>" + t.desc + "</div>" : "")
      + "<button class='fv'>" + (isFav ? "&#11088;" : "&#9734;") + "</button>";
    c.querySelector(".fv").onclick = function(e){ e.preventDefault(); e.stopPropagation(); togFav(t.name, this); };
    g.appendChild(c);
  });
}

function togFav(name, btn) {
  var idx = _favs.indexOf(name);
  if (idx > -1) { _favs.splice(idx, 1); btn.innerHTML = "&#9734;"; }
  else { _favs.push(name); btn.innerHTML = "&#11088;"; }
  localStorage.setItem("lh_favs", JSON.stringify(_favs));
  tst(idx > -1 ? "Removed from favourites" : "Added to favourites &#11088;");
}

function copyKey() {
  if (!curKey) return;

}

async function trackOnline() {

  try {
    var r = await apiCall("track-online", "POST", { sessionId: _sessionId, key: curKey, newSession: false });
    if (r) {
      var el = document.getElementById("onlineCount");
      if (el) el.textContent = r.count || 1;

  } catch(e) {}
}

// ═══ LOGOUT ═══
function doLogout() {
  clearInterval(_cdTimer);
  curKey = null; curExp = null; _toolsCache = null; _allTools = [];
  localStorage.removeItem("lh_k");
  localStorage.removeItem("lh_e");
  localStorage.removeItem("lh_ct");
  document.getElementById("lk").value = "";
  hideErr();
  showS("ls");
  tst("Logged out!");
}
